        indicadorPix: 
          type: "string"
          description: "Código para informar se o boleto terá um QRCode Pix atrelado e qual o tipo de Pix utilizado.

Domínios:

 - 'S' - Pix com QRCode Dinâmico (Boleto com Pix);

 - 'N' - Sem Pix

 - 'A' -Pix com QRCode Dinâmico + recorrência (Boleto com Pix Automático - BB numero)

 - 'B' - Pix com QRCode Dinâmico + recorrência (Boleto com Pix Automático - Cliente numera)

 - 'C' -Pix com QRCode Location + recorrência (Boleto com Pix Automático com Location)

 - OUTRO - Sem Pix

Caso seja informado um caractere inválido, o sistema assumirá automaticamente N (Sem Pix)."
        idLocationPix: 
          type: "integer"
          description: "Número obtido no sistema Pix, que deve ser geradocom o tipoCob = cobv (Cobrança com vencimento). Estenúmero será considerado quando o indicadorPix = S ou indicadorPix = 'C'.

Domínios:

 - Maior que zero (> 0)  Pix com QRCode Location

 - Igual a zero (0) ou nulo  Pix sem Location"
        idLocationRecorrencia: 
          type: "integer"
          description: "Número obtido no sistema Pix, que deve ser gerado com o tipoCob = cobv (Cobrança com vencimento).

Este campo só é considerado quando indicadorPix = 'C'.

Domínios:

 - Maior que zero (> 0)  Pix com Location de recorrência

  - Igual a zero (0)  Sem Location de recorrência


Casos de uso::

Caso 1) Boleto sem Pix:

  -      indicadorPix ` 'S', 'A', 'B', 'C'

  -      idLocationPix: ignorado

 -      id - LocationRecorrencia: ignorado

Caso 2) Boleto com Pix dinâmico:

  -      indicadorPix = 'S' 

  -      idLocationPix = 0 ou nulo

 -      idLocationRecorrencia: não utilizado

Caso 3) Boleto com Pix Location: 

-     indicadorPix = 'S'

-     idLocationPix, número > 0

 -     idLocationRecorrencia: não utilizado 

Caso 4) Boleto com Pix Automático + recorrência:

-     indicadorPix = 'A'

-     campoUtilizacaoBeneficiario - esse campo deve estar em branco

-     idLocationPix - número = 0

-     idLocationRecorrencia - número = 0

  Observação: O código da recorrência é gerado e controlado pelo Banco do Brasil.

Caso 5) Boleto com Pix Automático + recorrência:

-     indicadorPix = 'B'

-     campoUtilizacaoBeneficiario - deve ser prenchido caracteres alfanumérico maiúsculo

-     idLocationPix - número = 0

-     idLocationRecorrencia - número = 0

  Observação: O conteúdo do campo campoUtilizacaoBeneficiario é o código da recorrência a ser utilizado em futuros boletos para o mesmo pagador

Caso 6) Boleto com Pix Automático + Location com recorrência: 

-     indicadorPix = 'C'

-     campoUtilizacaoBeneficiario - deve ser prenchido caracteres alfanumérico maiúsculo

